<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : barre d'onglets en haut, une colonne de travail centrée ; les documents s'ouvrent dans un panneau plein écran. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --sunken: #e8ece6;
  --line: #d3dad0;
  --fg: #1a231d;
  --muted: #5d6b61;
  --accent: #1d6a4f;
  --accent-fg: #ffffff;
  --accent-soft: #dcebe3;
  --ok: #1d7a43;
  --ok-soft: #dff1e5;
  --warn: #9a6400;
  --warn-soft: #fbeccd;
  --bad: #b03a2e;
  --bad-soft: #f8dfdb;
  --info: #2f5f9e;
  --info-soft: #dde7f5;
  --shadow: 0 1px 2px rgba(20, 40, 28, .06), 0 6px 24px rgba(20, 40, 28, .07);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111713; --surface: #18201b; --sunken: #0d120f; --line: #2c3830;
    --fg: #e5ece6; --muted: #98a89c; --accent: #4fb48b; --accent-fg: #0b1a12; --accent-soft: #1d3329;
    --ok: #5cc68a; --ok-soft: #173326; --warn: #e3ad4f; --warn-soft: #3a2c12;
    --bad: #ef8577; --bad-soft: #3d1d19; --info: #86aee6; --info-soft: #1b2a40;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111713; --surface: #18201b; --sunken: #0d120f; --line: #2c3830;
  --fg: #e5ece6; --muted: #98a89c; --accent: #4fb48b; --accent-fg: #0b1a12; --accent-soft: #1d3329;
  --ok: #5cc68a; --ok-soft: #173326; --warn: #e3ad4f; --warn-soft: #3a2c12;
  --bad: #ef8577; --bad-soft: #3d1d19; --info: #86aee6; --info-soft: #1b2a40;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* En-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in, .main, .banner-in { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 6px; }
.brand h1 { font-size: 1.25rem; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand h1 span { font-family: var(--f-body); font-size: .85rem; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mark { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-fg); display: inline-grid; place-items: center; font-size: .9rem; flex: none; align-self: center; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { padding: 10px 12px; color: var(--muted); text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--fg); border-color: var(--accent); }
.tabs a:focus-visible, .btn:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.banner { background: var(--warn-soft); color: var(--warn); font-size: .9rem; }
.banner-in { padding-block: 8px; }
.main { padding-block: 20px 64px; display: grid; gap: 20px; }
.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.head h2 { font-size: 1.5rem; }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; min-height: 40px; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: .88rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Tuiles */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; }
.kpi .label { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.kpi .value { font-family: var(--f-mono); font-size: 1.3rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .sub { font-size: .85rem; color: var(--muted); }
@media (max-width: 820px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Listes */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.panel > h3 { font-size: 1rem; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.list { display: grid; }
.row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.6fr) auto auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.list > .row:first-child { border-top: 0; }
.row:hover { background: var(--sunken); }
.row .t1 { font-weight: 600; overflow-wrap: anywhere; }
.row .t2 { font-size: .88rem; color: var(--muted); overflow-wrap: anywhere; }
.row .amt { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
@media (max-width: 640px) {
  .row { grid-template-columns: minmax(0, 1fr) auto; }
  .row .c-client { grid-column: 1; grid-row: 2; }
  .row .amt { grid-column: 2; grid-row: 1; }
  .row .c-status { grid-column: 2; grid-row: 2; justify-self: end; }
}
.empty { padding: 28px 16px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty strong { color: var(--fg); font-family: var(--f-display); font-size: 1.05rem; }

.pill { display: inline-block; font-size: .78rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--sunken); color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: .88rem; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); font-weight: 600; }
.search { flex: 1 1 200px; min-width: 0; }

/* Formulaires */
label.f { display: grid; gap: 4px; font-size: .85rem; font-weight: 500; color: var(--muted); min-width: 0; }
input.in, select.in, textarea.in { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; min-height: 40px; color: var(--fg); font-size: 15px; }
textarea.in { min-height: 72px; resize: vertical; }
input.in:focus, select.in:focus, textarea.in:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.check { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; }
.card h3 { font-size: 1.05rem; }

/* Panneau d'édition */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-bar { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-bar .top-in { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; flex-wrap: wrap; }
.sheet-bar h2 { font-size: 1.15rem; }
.sheet .main { max-width: 900px; }

.lines { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.line { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, .8fr) minmax(0, .9fr) minmax(0, 1.3fr) minmax(0, 1.3fr) 36px; gap: 8px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); }
.line.hd { border-top: 0; background: var(--sunken); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.line .tot { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.line .lbl-m { display: none; }
@media (max-width: 720px) {
  .line.hd { display: none; }
  .line { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .line .c-desc { grid-column: 1 / -1; }
  .line .tot { grid-column: 1 / 3; text-align: left; }
  .line .lbl-m { display: block; font-size: .75rem; color: var(--muted); }
  .line .c-del { justify-self: end; }
}
.totals { display: grid; gap: 6px; justify-self: end; min-width: min(100%, 340px); }
.totals div { display: flex; justify-content: space-between; gap: 24px; }
.totals .grand { font-weight: 600; font-size: 1.1rem; border-top: 1px solid var(--line); padding-top: 8px; }
.words { font-size: .9rem; color: var(--muted); font-style: italic; }

/* Aperçu du document : reprend la mise en page du modèle papier de l'entreprise */
.paper { background: #fff; color: #1a1a1a; border-radius: 6px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 44px); display: grid; gap: 18px; font-size: 14px; overflow-x: auto; }
.paper .p-logo img { max-width: min(560px, 100%); display: block; }
.paper .p-logo strong { font-family: var(--f-display); font-size: 1.8rem; color: #1d6a4f; display: block; }
.paper .p-logo em { color: #1d6a4f; }
.paper .p-right { text-align: right; display: grid; gap: 6px; font-size: 15px; }
.paper .p-meta, .paper .p-cond { display: grid; gap: 3px; }
.paper .p-cond { padding-left: 64px; font-size: 15px; }
.paper table { width: 100%; border-collapse: collapse; min-width: 520px; }
.paper th, .paper td { border: 1px solid #1a1a1a; padding: 5px 8px; }
.paper th { font-weight: 600; letter-spacing: .12em; font-size: 12px; }
.paper .c { text-align: center; }
.paper .r { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.paper tfoot td { letter-spacing: .12em; font-size: 12.5px; }
.paper tfoot .r { letter-spacing: 0; font-size: 13.5px; }
.paper .ttc td { font-weight: 700; }
.paper .p-words { margin: 0; }
.paper .p-foot { border-top: 1px solid #e3e8e2; padding-top: 10px; font-size: 11.5px; color: #666; text-transform: uppercase; }
@media (max-width: 640px) { .paper .p-cond { padding-left: 0; } }

/* Fenêtre de confirmation */
.dialog-bg { position: fixed; inset: 0; z-index: 60; background: rgba(10, 20, 14, .45); display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; width: min(440px, 100%); display: grid; gap: 14px; max-height: 90vh; overflow-y: auto; }
.dialog h3 { font-size: 1.15rem; }

.pipe { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pipe-step { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; cursor: pointer; text-align: left; font-weight: 500; min-width: 0; }
.pipe-step:hover { border-color: var(--accent); }
.pipe-step .pill { font-size: .95rem; min-width: 30px; text-align: center; }
@media (max-width: 720px) { .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; counter-reset: st; }
.steps li { counter-increment: st; font-size: .78rem; color: var(--muted); border-top: 4px solid var(--line); padding-top: 6px; overflow-wrap: anywhere; }
.steps li::before { content: counter(st) ". "; }
.steps li.done { border-color: var(--accent); color: var(--fg); }
.steps li.now { border-color: var(--warn); color: var(--fg); font-weight: 600; }
.c-desc { position: relative; }
textarea.desc { min-height: 40px; resize: vertical; line-height: 1.35; }
.sugg { position: absolute; left: 0; right: 0; top: 100%; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); display: grid; overflow: hidden; }
.sugg button { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer; text-align: left; font-size: .9rem; color: var(--fg); }
.sugg button:first-child { border-top: 0; }
.sugg button:hover, .sugg button:focus { background: var(--accent-soft); }
.paper .p-signature { justify-self: end; text-align: center; font-size: 15px; padding-right: 20px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 500; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.ex-tag { font-size: .72rem; font-weight: 600; color: var(--info); background: var(--info-soft); border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(12px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<script>
"use strict";

/* ---------- État ---------- */
const S = {
  ready: false,
  company: {},
  clients: [],
  sites: [],
  services: [],
  docs: [],
  view: "tableau",
  filter: { devis: "tous", factures: "tous", dossiers: "encours", q: "" },
  editing: null,   // document en cours d'édition (copie)
  viewing: null,   // id du document affiché en aperçu
  canWrite: true,
};
let db = null, downloads = null;

const DEVIS_STATUS = {
  brouillon: ["Brouillon", ""],
  envoye: ["Envoyé", "info"],
  accepte: ["Accepté", "ok"],
  refuse: ["Refusé", "bad"],
  archive: ["Archivé", ""],
};
/* Étapes d'un dossier : demande WF → devis → bon de commande → intervention → facture → paiement */
const STAGES = [
  ["demande", "Devis à faire", "warn"],
  ["devis", "Attente du BC", "info"],
  ["bc", "Intervention à faire", "warn"],
  ["intervention", "À facturer", "warn"],
  ["facture", "Facturé", "info"],
  ["paye", "Payé", "ok"],
];
const PAY_MODES = ["Espèces", "Virement bancaire", "Chèque", "MVola", "Orange Money", "Airtel Money"];
const UNITS = ["U", "fft", "forfait", "heure", "jour", "mois", "ml", "m", "m²", "Bidon de 5L", "lot"];
const MONTHS = ["JANVIER", "FÉVRIER", "MARS", "AVRIL", "MAI", "JUIN", "JUILLET", "AOÛT", "SEPTEMBRE", "OCTOBRE", "NOVEMBRE", "DÉCEMBRE"];

/* ---------- Utilitaires ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const round = (n) => Math.round(Number(n) || 0);
function groupDigits(n) {
  const s = String(Math.abs(round(n)));
  return (n < 0 ? "-" : "") + s.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}
const ar = (n) => groupDigits(n) + " Ar";
const today = () => new Date().toISOString().slice(0, 10);
function addDays(iso, d) { const t = new Date(iso + "T00:00:00"); t.setDate(t.getDate() + Number(d || 0)); return t.toISOString().slice(0, 10); }
function frDate(iso) { if (!iso) return "—"; const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; }
function frLong(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${parseInt(d, 10)} ${MONTHS[parseInt(m, 10) - 1]} ${y}`; }
function daysBetween(a, b) { if (!a || !b) return 0; return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5); }
const docTitle = (d) => (d.type === "facture" ? "FACTURE" : "DEVIS") + " – " + d.number;
function footerText(co) {
  if (co.footer) return co.footer;
  return [co.nif && "NIF : " + co.nif, co.stat && "STAT : " + co.stat, co.bank && "COMPTE " + co.bank,
    co.rcs && "N° REGISTRE DE COMMERCE : " + co.rcs, co.phone && "CONTACT : " + co.phone, co.email && "MAIL : " + co.email].filter(Boolean).join(" – ");
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* Montant en lettres (usage malgache : « Arrêté(e) la présente … à la somme de … Ariary ») */
function enLettres(n) {
  n = Math.abs(round(n));
  if (n === 0) return "zéro";
  const u = ["", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize", "dix-sept", "dix-huit", "dix-neuf"];
  const d = ["", "dix", "vingt", "trente", "quarante", "cinquante", "soixante", "soixante", "quatre-vingt", "quatre-vingt"];
  const lt100 = (x, noPlural) => {
    if (x < 20) return u[x];
    const t = Math.floor(x / 10); let r = x % 10;
    if (t === 7 || t === 9) r += 10;
    if (r === 0) return t === 8 && !noPlural ? "quatre-vingts" : d[t];
    if ((r === 1 || r === 11) && t < 8) return d[t] + " et " + u[r];
    return d[t] + "-" + u[r];
  };
  const lt1000 = (x, noPlural) => {
    const h = Math.floor(x / 100), r = x % 100;
    if (!h) return lt100(r, noPlural);
    const hw = h === 1 ? "cent" : u[h] + " cent";
    if (!r) return h > 1 && !noPlural ? hw + "s" : hw;
    return hw + " " + lt100(r, noPlural);
  };
  const parts = [];
  for (const [v, name] of [[1e9, "milliard"], [1e6, "million"], [1e3, "mille"]]) {
    const q = Math.floor(n / v);
    if (q) {
      if (name === "mille") parts.push(q === 1 ? "mille" : lt1000(q, true) + " mille");
      else parts.push(lt1000(q) + " " + name + (q > 1 ? "s" : ""));
      n %= v;
    }
  }
  if (n) parts.push(lt1000(n));
  return parts.join(" ");
}
const capFirst = (s) => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- Calculs ---------- */
function totals(doc) {
  const ht = (doc.lines || []).reduce((s, l) => s + round((Number(l.qty) || 0) * (Number(l.price) || 0)), 0);
  const remise = round(ht * (Number(doc.discount) || 0) / 100);
  const net = ht - remise;
  const rate = doc.vat ? Number(doc.vatRate) || 0 : 0;
  const tva = round(net * rate / 100);
  const ttc = net + tva;
  const paid = (doc.payments || []).reduce((s, p) => s + round(p.amount), 0);
  return { ht, remise, net, tva, ttc, rate, paid, due: Math.max(0, ttc - paid) };
}
function invoiceState(doc) {
  const t = totals(doc);
  if (t.ttc > 0 && t.paid >= t.ttc) return ["Payée", "ok", "payee"];
  if (doc.dueDate && doc.dueDate < today()) return ["En retard", "bad", "retard"];
  if (t.paid > 0) return ["Partielle", "warn", "partielle"];
  return ["À encaisser", "info", "impayee"];
}
function statusPill(doc) {
  const [label, cls] = doc.type === "facture" ? invoiceState(doc) : (DEVIS_STATUS[doc.status] || DEVIS_STATUS.brouillon);
  return `<span class="pill ${cls}">${label}</span>`;
}
/* Numérotation continue d'une année à l'autre, au format du modèle : CERF-N°01750/2024 */
function nextNumber(type, dateIso) {
  const co = S.company;
  const year = (dateIso || today()).slice(0, 4);
  const prefix = (co.prefix ?? "CERF").trim();
  let max = 0;
  for (const d of S.docs) {
    if (d.type !== type) continue;
    const m = /N°\s*(\d+)/.exec(d.number || "");
    if (m) max = Math.max(max, parseInt(m[1], 10));
  }
  const n = Math.max(max + 1, Number(type === "facture" ? co.nextFacture : co.nextDevis) || 1);
  return (prefix ? prefix + "-" : "") + "N°" + String(n).padStart(5, "0") + "/" + year;
}
const clientOf = (doc) => S.clients.find((c) => c.id === doc.clientId) || doc.clientSnap || {};
function stageOf(d) {
  if (d.status === "refuse") return ["refuse", "Refusé", "bad"];
  if (d.status === "archive") return ["archive", "Archivé", ""];
  const f = d.factureId && S.docs.find((x) => x.id === d.factureId);
  if (f) return invoiceState(f)[2] === "payee" ? STAGES[5] : STAGES[4];
  if (d.intervention && d.intervention.date) return STAGES[3];
  if (d.bc && d.bc.number) return STAGES[2];
  if (d.status === "brouillon") return STAGES[0];
  return STAGES[1];
}
const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
/* Dernier prix pratiqué pour cette désignation sur cette agence, sinon prix du catalogue */
function priceFor(label, concerne) {
  const k = norm(label), c = norm(concerne);
  if (c) for (const d of S.docs) {
    if (d.type !== "devis" || norm(d.concerne) !== c) continue;
    const l = (d.lines || []).find((x) => norm(x.label) === k);
    if (l) return { price: l.price, unit: l.unit, from: d.number };
  }
  const svc = S.services.find((x) => norm(x.label) === k);
  return svc ? { price: svc.price, unit: svc.unit, from: "" } : null;
}
const siteByName = (clientId, name) => S.sites.find((x) => x.clientId === clientId && norm(x.name) === norm(name));

/* ---------- Données ---------- */
function snapList(snap) { return snap.docs.map((d) => ({ id: d.id, ...d.data() })); }
function onDbError(e) { showBanner("Connexion aux données interrompue (" + (e && e.code) + "). Rechargez la page."); }

async function boot() {
  route();
  window.addEventListener("hashchange", route);
  render();
  const c = window.claude;
  if (!c || !c.use) { showBanner("Ouvrez ce logiciel depuis claude.ai, connecté à votre compte, pour enregistrer vos données."); S.ready = true; render(); return; }
  const [dbNs, user, dl] = await Promise.all([c.use("db"), c.use("user"), c.use("downloads")]);
  db = dbNs; downloads = dl;
  if (!db) { showBanner("Les données ne sont pas accessibles ici. Connectez-vous à claude.ai pour utiliser le logiciel."); S.ready = true; render(); return; }
  if (user) {
    const w = await user.can("data.write");
    if (w === false) { S.canWrite = false; showBanner("Lecture seule : vous pouvez consulter, mais pas modifier."); }
  }
  let pending = 5;
  const done = () => { if (--pending <= 0) { S.ready = true; } if (!S.editing) render(); };
  db.doc("settings/company").onSnapshot((s) => { S.company = s.exists ? s.data() : {}; done(); }, onDbError);
  db.collection("clients").orderBy("name").onSnapshot((s) => { S.clients = snapList(s); done(); }, onDbError);
  db.collection("services").orderBy("label").onSnapshot((s) => { S.services = snapList(s).sort((a, b) => (b.count || 0) - (a.count || 0)); done(); }, onDbError);
  db.collection("sites").orderBy("name").onSnapshot((s) => { S.sites = snapList(s); done(); }, onDbError);
  db.collection("docs").orderBy("createdAt", "desc").onSnapshot((s) => { S.docs = snapList(s); done(); }, onDbError);
}

async function save(path, data) {
  if (!db) { toast("Données indisponibles : impossible d'enregistrer."); return false; }
  try { await db.doc(path).set(data); return true; }
  catch (e) {
    if (e && e.code === "invalid_argument" && !S.canWrite) toast("Vous n'avez pas le droit de modifier.");
    else if (e && e.code === "quota_exceeded") toast("Espace de stockage plein. Supprimez d'anciens documents.");
    else toast("Échec de l'enregistrement. Réessayez.");
    return false;
  }
}
async function remove(path) {
  if (!db) return false;
  try { await db.doc(path).delete(); return true; } catch { toast("Échec de la suppression."); return false; }
}

    <p class="muted" style="margin:0;font-size:.85rem">Aperçu : <span class="num">DEVIS – ${esc(nextNumber("devis"))}</span>. Le logiciel continue toujours après le plus grand numéro déjà utilisé.</p>
    <h3>Paiement et conditions</h3>
    <div class="grid2">${fld("bank", "Compte bancaire", c.bank, "text", "BOA TALATAMATY : 00009 …")}${fld("mobile", "Numéro Mobile Money", c.mobile, "text", "MVola 034 …")}</div>
    <div class="grid2">${fld("validity", "Délai valide de l'offre (jours)", c.validity ?? 30, "number")}${fld("terms", "Délai de paiement des factures (jours)", c.terms ?? 30, "number")}</div>
    <div class="grid2">${fld("startDelay", "Début de travaux (par défaut)", c.startDelay ?? "2 jours après BC")}${fld("execDelay", "Délai d'exécution (par défaut)", c.execDelay ?? "1 jour")}</div>
    <label class="f">Pied de page (laissez vide pour le composer automatiquement avec NIF, STAT, compte, RCS, contact et e-mail)<textarea class="in" id="co_footer" ${ro}>${esc(c.footer || "")}</textarea></label>
    <p class="muted" style="margin:0;font-size:.85rem">Pied de page actuel : ${esc(footerText(c)) || "—"}</p>
    ${S.canWrite ? `<div class="actions"><button class="btn primary" type="submit">Enregistrer</button></div>` : ""}
  </form>`;
}

/* ---------- Éditeur de document ---------- */
function newDoc(type) {
  const c = S.company, date = today();
  return {
    id: uid(), type, number: nextNumber(type, date), date,
    validUntil: type === "devis" ? addDays(date, c.validity ?? 30) : "",
    dueDate: type === "facture" ? addDays(date, c.terms ?? 30) : "",
    clientId: "", subject: "", reference: "", concerne: "", status: "brouillon",
    startDelay: type === "devis" ? (c.startDelay ?? "2 jours après BC") : "",
    execDelay: type === "devis" ? (c.execDelay ?? "1 jour") : "",
    garantie: "", marque: "", delaiLivraison: "", debutLivraison: "", siteId: "", bc: null, intervention: null,
    lines: [{ label: "", qty: 1, unit: "U", price: 0 }],
    discount: 0, vat: !!c.vat, vatRate: Number(c.vatRate ?? 20),
    notes: "", payments: [], createdAt: Date.now(), isNew: true,
  };
}

function lineHtml(l, i) {
  return `<div class="line" data-i="${i}">
    <label class="c-desc"><span class="lbl-m">Désignation</span><textarea class="in desc" rows="${Math.max(1, String(l.label).split("\n").length)}" data-f="label" placeholder="Tapez pour chercher dans le catalogue" autocomplete="off">${esc(l.label)}</textarea><span class="sugg" hidden></span></label>
    <label><span class="lbl-m">Qté</span><input class="in num" type="number" inputmode="decimal" step="any" min="0" data-f="qty" value="${esc(l.qty)}"></label>
    <label><span class="lbl-m">Unité</span><input class="in" list="unitList" data-f="unit" value="${esc(l.unit)}"></label>
    <label><span class="lbl-m">P.U. HT (Ar)</span><input class="in num" type="number" inputmode="numeric" step="1" min="0" data-f="price" value="${esc(l.price)}"></label>
    <span class="tot" data-tot>${ar((Number(l.qty) || 0) * (Number(l.price) || 0))}</span>
    <button type="button" class="btn ghost sm c-del" data-action="del-line" aria-label="Supprimer la ligne">✕</button>
  </div>`;
}

function totalsHtml(d) {
  const t = totals(d);
  return `<div><span>Total HT</span><span class="num">${ar(t.ht)}</span></div>
    ${t.remise ? `<div><span>Remise ${d.discount} %</span><span class="num">− ${ar(t.remise)}</span></div><div><span>Net HT</span><span class="num">${ar(t.net)}</span></div>` : ""}
    <div><span>TVA ${Number(d.vatRate) || 20} %${d.vat ? "" : " (non appliquée)"}</span><span class="num">${d.vat ? ar(t.tva) : "–"}</span></div>
    <div class="grand"><span>Total TTC</span><span class="num">${ar(t.ttc)}</span></div>`;
}

function editorHtml(d) {
  const isF = d.type === "facture";
  return `<div class="sheet-bar"><div class="top-in">
      <h2>${d.isNew ? (isF ? "Nouvelle facture" : "Nouveau devis") : "Modifier " + esc(d.number)}</h2>
      <div class="actions"><button class="btn" data-action="close-sheet">Annuler</button><button class="btn primary" data-action="save-doc">Enregistrer</button></div>
    </div></div>
  <div class="main">
    <div class="card">
      <div class="grid3">
        <label class="f">Numéro<input class="in num" id="e_number" value="${esc(d.number)}"></label>
        <label class="f">Date<input class="in" type="date" id="e_date" value="${esc(d.date)}"></label>
        ${isF ? `<label class="f">Échéance de paiement<input class="in" type="date" id="e_dueDate" value="${esc(d.dueDate)}"></label>`
              : `<label class="f">Valable jusqu'au<input class="in" type="date" id="e_validUntil" value="${esc(d.validUntil)}"></label>`}
      </div>
      <div class="grid2">
        <label class="f">Client
          <select class="in" id="e_clientId"><option value="">— Choisir un client —</option>${S.clients.map((c) => `<option value="${esc(c.id)}" ${c.id === d.clientId ? "selected" : ""}>${esc(c.name)}</option>`).join("")}<option value="__new">+ Ajouter un nouveau client…</option></select>
        </label>
        <label class="f">Objet<input class="in" id="e_subject" value="${esc(d.subject)}" placeholder="Ex. : Entretien groupe électrogène"></label>
      </div>
      <div class="grid2">
        <label class="f">Référence<input class="in" id="e_reference" value="${esc(d.reference || "")}" placeholder="Ex. : WF24638 (référence de la demande du client)"></label>
        <label class="f">Concerne (agence, site)<input class="in" id="e_concerne" list="siteList" value="${esc(d.concerne || "")}" placeholder="Ex. : BOA AMBOHIMASOA"></label>
      </div>
      ${isF ? `<div class="grid2">
        <label class="f">Bon de commande N°<input class="in" id="e_bcNumber" value="${esc((d.bc && d.bc.number) || "")}"></label>
        <label class="f">Date du bon de commande<input class="in" type="date" id="e_bcDate" value="${esc((d.bc && d.bc.date) || "")}"></label>
      </div>` : `<div class="grid2">
        <label class="f">Marque<input class="in" id="e_marque" value="${esc(d.marque || "")}" placeholder="Ex. : AIR PRO"></label>
        <label class="f">Garantie<input class="in" id="e_garantie" value="${esc(d.garantie || "")}" placeholder="Ex. : 6 mois ou 200 heures"></label>
      </div>
      <div class="grid2">
        <label class="f">Délai de livraison<input class="in" id="e_delaiLivraison" value="${esc(d.delaiLivraison || "")}"></label>
        <label class="f">Début de livraison<input class="in" id="e_debutLivraison" value="${esc(d.debutLivraison || "")}"></label>
      </div>`}
      ${!isF ? `<div class="grid3">
        <label class="f">Début de travaux<input class="in" id="e_startDelay" value="${esc(d.startDelay || "")}" placeholder="2 jours après BC"></label>
        <label class="f">Délai d'exécution<input class="in" id="e_execDelay" value="${esc(d.execDelay || "")}" placeholder="1 jour"></label>
        <label class="f">Statut<select class="in" id="e_status">${Object.entries(DEVIS_STATUS).map(([k, [l]]) => `<option value="${k}" ${d.status === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      </div>` : ""}
    </div>
    <div class="lines" id="lines">
      <div class="line hd"><span>Désignation</span><span>Qté</span><span>Unité</span><span>P.U. HT</span><span style="text-align:right">Montant HT</span><span></span></div>
      ${d.lines.map(lineHtml).join("")}
    </div>
    <div><button class="btn" data-action="add-line">+ Ajouter une ligne</button></div>
    <div class="card">
      <div class="grid3">
        <label class="f">Remise (%)<input class="in num" type="number" min="0" max="100" step="any" id="e_discount" value="${esc(d.discount)}"></label>
        <label class="check" style="align-self:end;min-height:40px"><input type="checkbox" id="e_vat" ${d.vat ? "checked" : ""}> Appliquer la TVA</label>
        <label class="f">Taux TVA (%)<input class="in num" type="number" min="0" step="any" id="e_vatRate" value="${esc(d.vatRate)}"></label>
      </div>
      <div class="totals" id="totals">${totalsHtml(d)}</div>
      <div class="words" id="words">${wordsLine(d)}</div>
      <label class="f">Remarque (imprimée sur le document)<textarea class="in" id="e_notes">${esc(d.notes)}</textarea></label>
    </div>
  </div>
  <datalist id="siteList">${S.sites.filter((x) => !d.clientId || x.clientId === d.clientId).map((x) => `<option value="${esc(x.name)}">`).join("")}</datalist>
  <datalist id="unitList">${UNITS.map((u) => `<option value="${u}">`).join("")}</datalist>`;
}
function wordsParts(d) {
  const t = totals(d);
  const what = d.type === "facture" ? "Arrêtée la présente facture" : "Arrêté le présent devis";
  return [`${what} à la somme de : `, `${capFirst(enLettres(t.ttc))} Ariary (${ar(t.ttc)})`];
}
const wordsLine = (d) => wordsParts(d).join("");

function docParts(d) {
  const cl = clientOf(d), isF = d.type === "facture";
  const clientLines = [cl.address, cl.phone && "Tél : " + cl.phone, cl.city,
    [cl.nif && "NIF : " + cl.nif, cl.stat && "STAT : " + cl.stat].filter(Boolean).join(" / ")].filter(Boolean);
  const bc = d.bc && d.bc.number ? "N° " + d.bc.number + (d.bc.date ? " du " + frDate(d.bc.date) : "") : "";
  const meta = [["Objet", d.subject], ["Référence", d.reference], ["Concerne", d.concerne], isF && ["Bon de commande", bc]].filter((x) => x && x[1]);
  const cond = isF ? [["Échéance de paiement", frDate(d.dueDate)]]
    : [["Marque", d.marque], ["Délai valide de l'offre", d.validUntil ? daysBetween(d.date, d.validUntil) + " jours" : ""], ["Début de travaux", d.startDelay], ["Délai d'exécution", d.execDelay],
       ["Délai de livraison", d.delaiLivraison], ["Début de livraison", d.debutLivraison], ["Garantie", d.garantie]].filter((x) => x[1]);
  return { cl, clientLines, meta, cond };
}
const fmtQty = (q) => String(Number(q) || 0).replace(".", ",");

/* ---------- Aperçu (même mise en page que le modèle papier) ---------- */
function paperHtml(d) {
  const co = S.company, t = totals(d), isF = d.type === "facture";
  const { cl, clientLines, meta, cond } = docParts(d);
  const [w1, w2] = wordsParts(d);
  const foot = footerText(co);
  return `<article class="paper">
    <div class="p-logo">${co.logo ? `<img src="${esc(co.logo)}" alt="${esc(co.name || "Logo")}">` : `<strong>${esc(co.name || "Nom de votre entreprise")}</strong><em>${esc(co.activity || "")}</em>`}</div>
    <div class="p-right">
      <div>${esc(docTitle(d))}</div><div>${frLong(d.date)}</div>
      <div>DOIT : ${esc(cl.name || "—")}</div>
      ${clientLines.map((l) => `<div>${esc(l)}</div>`).join("")}
    </div>
    ${meta.length ? `<div class="p-meta">${meta.map(([k, v]) => `<div><u>${k}</u> : ${esc(v)}</div>`).join("")}</div>` : ""}
    <div style="overflow-x:auto"><table>
      <thead><tr><th>QTES</th><th>DÉSIGNATION</th><th>UNITÉS</th><th>P.U Ar</th><th>MONTANT Ar</th></tr></thead>
      <tbody>${d.lines.map((l) => `<tr><td class="c">${fmtQty(l.qty)}</td><td class="c">${esc(l.label).replace(/\n/g, "<br>")}</td><td class="c">${esc(l.unit)}</td><td class="r">${groupDigits(l.price)}</td><td class="r">${groupDigits((Number(l.qty) || 0) * (Number(l.price) || 0))}</td></tr>`).join("")}</tbody>
      <tfoot>
        <tr><td colspan="4" class="c">MONTANT HT</td><td class="r">${groupDigits(t.ht)}</td></tr>
        ${t.remise ? `<tr><td colspan="4" class="c">REMISE ${esc(d.discount)} %</td><td class="r">− ${groupDigits(t.remise)}</td></tr><tr><td colspan="4" class="c">NET HT</td><td class="r">${groupDigits(t.net)}</td></tr>` : ""}
        <tr><td colspan="4" class="c">TVA ${Number(d.vatRate) || 20} %</td><td class="${d.vat ? "r" : "c"}">${d.vat ? groupDigits(t.tva) : "–"}</td></tr>
        <tr class="ttc"><td colspan="4" class="c">MONTANT TTC</td><td class="r">${groupDigits(t.ttc)}</td></tr>
      </tfoot>
    </table></div>
    <p class="p-words">${esc(w1)}<strong>${esc(w2)}</strong></p>
    ${isF && t.paid ? `<div class="p-meta"><div>Déjà réglé : <span class="num">${ar(t.paid)}</span></div><div><strong>Reste à payer : <span class="num">${ar(t.due)}</span></strong></div></div>` : ""}
    ${cond.length ? `<div class="p-cond">${cond.map(([k, v]) => `<div><u>${k}</u> : ${esc(v)}</div>`).join("")}</div>` : ""}
    ${d.notes ? `<div class="p-meta"><div><u>Remarque</u> : ${esc(d.notes).replace(/\n/g, "<br>")}</div></div>` : ""}
    ${co.signName ? `<div class="p-signature">${esc(co.signTitle || "Le Gérant")}<br><strong>${esc(co.signName)}</strong></div>` : ""}
    ${co.mobile ? `<div class="p-meta"><div><u>Paiement Mobile Money</u> : ${esc(co.mobile)}</div></div>` : ""}
    ${foot ? `<div class="p-foot">${esc(foot)}</div>` : ""}
  </article>`;
}

function viewerHtml(d) {
  const isF = d.type === "facture", t = totals(d);
  const linked = d.factureId ? S.docs.find((x) => x.id === d.factureId) : null;
  const source = d.sourceId ? S.docs.find((x) => x.id === d.sourceId) : null;
  const w = S.canWrite;
  const st = isF ? null : stageOf(d);
  const stepIdx = st ? STAGES.findIndex((x) => x[0] === st[0]) : -1;
  const steps = st && stepIdx >= 0 ? `<ol class="steps">${["Demande", "Devis", "Bon de commande", "Intervention", "Facture", "Paiement"].map((l, i) => `<li class="${i < stepIdx ? "done" : i === stepIdx ? "now" : ""}">${l}</li>`).join("")}</ol>` : "";
  const info = [
    d.bc && d.bc.number && `Bon de commande N° ${esc(d.bc.number)}${d.bc.date ? " du " + frDate(d.bc.date) : ""}`,
    d.intervention && d.intervention.date && `Intervention réalisée le ${frDate(d.intervention.date)}${d.intervention.pv ? " · PV de réception signé" : " · PV non signé"}${d.intervention.notes ? " · " + esc(d.intervention.notes) : ""}`,
  ].filter(Boolean);
  return `<div class="sheet-bar"><div class="top-in">
      <h2><span class="num">${esc(d.number)}</span> ${st ? `<span class="pill ${st[2]}">${st[1]}</span>` : statusPill(d)}</h2>
      <div class="actions">
        <button class="btn" data-action="close-sheet">Fermer</button>
        <button class="btn primary" data-action="pdf">Télécharger le PDF</button>
      </div></div></div>
  <div class="main">
    ${steps}
    ${info.length ? `<div class="card" style="gap:6px">${info.map((x) => `<div>${x}</div>`).join("")}</div>` : ""}
    <div class="actions">
      ${w ? `<button class="btn ${st && st[0] === "demande" ? "primary" : ""}" data-action="edit-doc">${st && st[0] === "demande" ? "Préparer le devis" : "Modifier"}</button>` : ""}
      ${w && !isF && d.status === "brouillon" && totals(d).ht ? `<button class="btn primary" data-action="set-status" data-val="envoye">Marquer envoyé</button>` : ""}
      ${w && !isF && st && ["devis", "archive"].includes(st[0]) ? `<button class="btn primary" data-action="bc">Enregistrer le bon de commande</button>` : ""}
      ${w && !isF && st && st[0] === "bc" ? `<button class="btn primary" data-action="intervention">Intervention réalisée</button>` : ""}
      ${w && !isF && !linked && st && ["bc", "intervention"].includes(st[0]) ? `<button class="btn primary" data-action="to-invoice">Créer la facture</button>` : ""}
      ${w && !isF && !linked && st && !["bc", "intervention"].includes(st[0]) ? `<button class="btn" data-action="to-invoice">Transformer en facture</button>` : ""}
      ${w && !isF && d.status !== "refuse" && !linked ? `<button class="btn" data-action="set-status" data-val="refuse">Marquer refusé</button>` : ""}
      ${w && isF && t.due > 0 ? `<button class="btn" data-action="pay">Enregistrer un paiement</button>` : ""}
      ${w ? `<button class="btn" data-action="duplicate">Dupliquer</button>` : ""}
      ${w ? `<button class="btn danger" data-action="delete-doc">Supprimer</button>` : ""}
    </div>
    ${linked ? `<p class="muted" style="margin:0">Facturé : <a href="#" data-action="open-doc" data-id="${esc(linked.id)}">${esc(linked.number)}</a></p>` : ""}
    ${source ? `<p class="muted" style="margin:0">Issue du devis <a href="#" data-action="open-doc" data-id="${esc(source.id)}">${esc(source.number)}</a></p>` : ""}
    ${isF && (d.payments || []).length ? `<section class="panel"><h3>Paiements reçus</h3><div class="list">${d.payments.map((p, i) => `<div class="row" style="cursor:default"><span class="t1">${frDate(p.date)}</span><span class="c-client t2">${esc(p.mode)}${p.ref ? " · " + esc(p.ref) : ""}</span><span class="amt">${ar(p.amount)}</span><span class="c-status">${w ? `<button class="btn ghost sm" data-action="del-pay" data-i="${i}">Retirer</button>` : ""}</span></div>`).join("")}</div></section>` : ""}
    ${paperHtml(d)}
  </div>`;
}

function renderSheet() {
  const el = $("#sheet");
  if (S.editing) { el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${editorHtml(S.editing)}</div>`; return; }
  const d = S.viewing && S.docs.find((x) => x.id === S.viewing);
  el.innerHTML = d ? `<div class="sheet" role="dialog" aria-modal="true">${viewerHtml(d)}</div>` : "";
  document.body.style.overflow = d ? "hidden" : "";
}

function refreshTotals() {
  const d = S.editing;
  $("#totals").innerHTML = totalsHtml(d);
  $("#words").textContent = wordsLine(d);
}

/* ---------- Fenêtres ---------- */
function openDialog(html, onSubmit) {
  const el = $("#dialog");
  el.innerHTML = `<div class="dialog-bg" data-action="close-dialog-bg"><form class="dialog" id="dlgForm">${html}</form></div>`;
  const form = $("#dlgForm");
  form.addEventListener("submit", async (e) => { e.preventDefault(); const ok = await onSubmit(form); if (ok !== false) closeDialog(); });
  const first = form.querySelector("input, select, textarea, button");
  if (first) first.focus();
}
function closeDialog() { $("#dialog").innerHTML = ""; }
function confirmDialog(title, text, label, fn) {
  openDialog(`<h3>${esc(title)}</h3><p style="margin:0">${esc(text)}</p><div class="actions" style="justify-content:flex-end"><button type="button" class="btn" data-action="close-dialog">Annuler</button><button class="btn primary" type="submit">${esc(label)}</button></div>`, fn);
}

function demandeDialog() {
  const main = S.clients.slice().sort((a, b) => S.docs.filter((d) => d.clientId === b.id).length - S.docs.filter((d) => d.clientId === a.id).length)[0];
  openDialog(`<h3>Nouvelle demande d'intervention</h3>
    <label class="f">Client<select class="in" id="n_client">${S.clients.map((c) => `<option value="${esc(c.id)}" ${main && c.id === main.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></label>
    <label class="f">Référence (WF)<input class="in" id="n_ref" placeholder="WF36500"></label>
    <label class="f">Concerne (agence, site)<input class="in" id="n_site" list="siteList2" placeholder="BOA …"></label>
    <datalist id="siteList2">${S.sites.map((x) => `<option value="${esc(x.name)}">`).join("")}</datalist>
    <label class="f">Objet<input class="in" id="n_obj" placeholder="Devis entretien Groupe électrogène ; matériel de la BOA."></label>
    <label class="f">Date de la demande<input class="in" id="n_date" type="date" value="${today()}"></label>
    <div class="actions" style="justify-content:flex-end"><button type="button" class="btn" data-action="close-dialog">Annuler</button><button class="btn primary" type="submit">Créer le dossier</button></div>`, async (form) => {
    const clientId = $("#n_client", form).value;
    if (!clientId) { toast("Ajoutez d'abord un client."); return false; }
    const d = newDoc("devis");
    Object.assign(d, { clientId, reference: $("#n_ref", form).value.trim(), concerne: $("#n_site", form).value.trim(), subject: $("#n_obj", form).value.trim(), date: $("#n_date", form).value || today(), lines: [] });
    d.validUntil = addDays(d.date, S.company.validity ?? 30);
    S.editing = d; await saveEditor();
    return true;
  });
}

function bcDialog(d) {
  openDialog(`<h3>Bon de commande reçu · ${esc(d.reference || d.number)}</h3>
    <div class="grid2"><label class="f">N° du bon de commande<input class="in" id="b_num" value="${esc((d.bc && d.bc.number) || "")}"></label>
    <label class="f">Date<input class="in" id="b_date" type="date" value="${esc((d.bc && d.bc.date) || today())}"></label></div>
    <div class="actions" style="justify-content:flex-end"><button type="button" class="btn" data-action="close-dialog">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div>`, async (form) => {
    const number = $("#b_num", form).value.trim();
    if (!number) { toast("Indiquez le numéro du bon de commande."); return false; }
    const { id, ...body } = d;
    const ok = await save("docs/" + id, { ...body, status: body.status === "archive" ? "archive" : "accepte", bc: { number, date: $("#b_date", form).value } });
    if (ok) toast("Bon de commande enregistré");
    return ok;
  });
}

function interventionDialog(d) {
  openDialog(`<h3>Intervention réalisée · ${esc(d.concerne || d.number)}</h3>
    <label class="f">Date de l'intervention<input class="in" id="i_date" type="date" value="${today()}"></label>

/* ---------- PDF ---------- */
function buildPdf(d) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: "mm", format: "a4" });
  const co = S.company, t = totals(d), isF = d.type === "facture";
  const { cl, clientLines, meta, cond } = docParts(d);
  const W = 210, M = 16, R = W - M, BOTTOM = 272;
  const ink = 25;
  let y = 12;
  const underlined = (label, value, x) => {
    pdf.text(label, x, y);
    const w = pdf.getTextWidth(label);
    pdf.setLineWidth(0.2); pdf.setDrawColor(ink); pdf.line(x, y + 0.9, x + w, y + 0.9);
    const lines = pdf.splitTextToSize(" : " + value, R - x - w);
    pdf.text(lines, x + w, y);
    y += 5.6 * lines.length;
  };
  const room = (h) => { if (y + h > BOTTOM) { pdf.addPage(); y = 20; } };

  if (co.logo) {
    const p = pdf.getImageProperties(co.logo);
    const w = 128, h = w * p.height / p.width;
    pdf.addImage(co.logo, co.logo.startsWith("data:image/png") ? "PNG" : "JPEG", M - 6, y, w, h);
    y += h + 3;
  } else {
    pdf.setFont("helvetica", "bold"); pdf.setFontSize(20); pdf.setTextColor(29, 106, 79);
    pdf.text(co.name || "Nom de votre entreprise", M, y + 8);
    pdf.setFont("helvetica", "italic"); pdf.setFontSize(10);
    if (co.activity) pdf.text(co.activity, M, y + 14);
    y += 22;
  }

  pdf.setFont("helvetica", "normal"); pdf.setFontSize(11); pdf.setTextColor(ink);
  [docTitle(d), frLong(d.date), "DOIT : " + (cl.name || "—"), ...clientLines].forEach((l) => {
    pdf.splitTextToSize(l, 110).forEach((s) => { pdf.text(s, R, y, { align: "right" }); y += 6.2; });
  });
  y += 7;

  pdf.setFontSize(10.5);
  meta.forEach(([k, v]) => underlined(k, v, M));

  const foot = [[{ content: "MONTANT HT", colSpan: 4, styles: { halign: "center" } }, groupDigits(t.ht)]];
  if (t.remise) foot.push(
    [{ content: `REMISE ${d.discount} %`, colSpan: 4, styles: { halign: "center" } }, "- " + groupDigits(t.remise)],
    [{ content: "NET HT", colSpan: 4, styles: { halign: "center" } }, groupDigits(t.net)]);
  foot.push([{ content: `TVA ${Number(d.vatRate) || 20} %`, colSpan: 4, styles: { halign: "center" } }, d.vat ? groupDigits(t.tva) : { content: "–", styles: { halign: "center" } }]);
  foot.push([{ content: "MONTANT TTC", colSpan: 4, styles: { halign: "center" } }, groupDigits(t.ttc)]);
  pdf.autoTable({
    startY: y + 4, theme: "grid", margin: { left: M, right: M, bottom: 30 },
    head: [["QTES", "DÉSIGNATION", "UNITÉS", "P.U Ar", "MONTANT Ar"]],
    body: d.lines.map((l) => [fmtQty(l.qty), l.label, l.unit, groupDigits(l.price), groupDigits((Number(l.qty) || 0) * (Number(l.price) || 0))]),
    foot, showFoot: "lastPage",
    styles: { font: "helvetica", fontSize: 9.5, textColor: ink, lineColor: ink, lineWidth: 0.25, cellPadding: 1.8, valign: "middle" },
    headStyles: { fillColor: 255, textColor: ink, fontStyle: "bold", halign: "center" },
    footStyles: { fillColor: 255, textColor: ink, fontStyle: "bold", halign: "right" },
    columnStyles: { 0: { halign: "center", cellWidth: 16 }, 1: { halign: "center" }, 2: { halign: "center", cellWidth: 26 }, 3: { halign: "right", cellWidth: 32 }, 4: { halign: "right", cellWidth: 36 } },
  });
  y = pdf.lastAutoTable.finalY + 11;

  room(20);
  const [w1, w2] = wordsParts(d);
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(10.5);
  pdf.text(w1, M, y);
  const x1 = M + pdf.getTextWidth(w1);
  pdf.setFont("helvetica", "bold");
  if (x1 + pdf.getTextWidth(w2) <= R) { pdf.text(w2, x1, y); y += 6; }
  else { y += 5.6; const ls = pdf.splitTextToSize(w2, R - M); pdf.text(ls, M, y); y += 5.6 * ls.length; }
  pdf.setFont("helvetica", "normal");

  if (isF && t.paid) { y += 3; room(14); pdf.text("Déjà réglé : " + ar(t.paid), M, y); y += 5.6; pdf.setFont("helvetica", "bold"); pdf.text("Reste à payer : " + ar(t.due), M, y); pdf.setFont("helvetica", "normal"); y += 5.6; }
  let ySign = null;
  if (cond.length) { y += 12; room(Math.max(cond.length * 6, 16)); ySign = y + 4; pdf.setFontSize(11); cond.forEach(([k, v]) => underlined(k, v, M + 16)); }
  pdf.setFontSize(10);
  if (d.notes) { y += 4; room(12); underlined("Remarque", d.notes, M); }
  if (co.mobile) { y += 2; room(8); underlined("Paiement Mobile Money", co.mobile, M); }
  if (co.signName) {
    /* À droite des conditions, comme sur les devis Word ; sinon sous le texte */
    let ys = ySign;
    if (ys === null) { y += 10; room(16); ys = y; }
    pdf.setFontSize(11); pdf.setTextColor(ink);
    pdf.text(co.signTitle || "Le Gérant", R - 30, ys, { align: "center" });
    pdf.setFont("helvetica", "bold"); pdf.text(co.signName, R - 30, ys + 6, { align: "center" }); pdf.setFont("helvetica", "normal");
  }

  const ft = footerText(co);
  if (ft) {
    const n = pdf.getNumberOfPages();
    pdf.setFont("helvetica", "normal"); pdf.setFontSize(8.5); pdf.setTextColor(110);
    const ls = pdf.splitTextToSize(ft, R - M);
    for (let p = 1; p <= n; p++) { pdf.setPage(p); pdf.text(ls, M, 290 - ls.length * 4); }
  }
  return pdf.output("blob");
}

async function downloadPdf(d) {
  if (!window.jspdf || !window.jspdf.jsPDF) { toast("Le module PDF n'a pas pu se charger. Vérifiez la connexion et rechargez."); return; }
  if (!downloads) { toast("Le téléchargement n'est pas disponible ici. Ouvrez le logiciel sur claude.ai."); return; }
  try {
    const blob = buildPdf(d);
    const name = (d.number + " " + (clientOf(d).name || "")).trim().replace(/[\\/:*?"<>|]+/g, "-") + ".pdf";
    await downloads.save({ filename: name, data: blob });
    toast("PDF prêt");
  } catch (e) {
    if (e && e.code === "declined") return;
    if (e && e.code === "rate_limited") { toast("Un téléchargement est déjà en cours."); return; }
    toast("Le PDF n'a pas pu être créé.");
  }
}

/* ---------- Actions ---------- */
function openEditor(d) {
  S.editing = JSON.parse(JSON.stringify(d));
  if (!S.editing.lines || !S.editing.lines.length) S.editing.lines = [{ label: "", qty: 1, unit: "U", price: 0 }];
  S.viewing = null; renderSheet(); document.body.style.overflow = "hidden";
}
function closeSheet() { S.editing = null; S.viewing = null; render(); }

async function saveEditor() {
  const d = S.editing;
  if (!d.clientId) { toast("Choisissez un client."); return; }
  d.lines = d.lines.filter((l) => l.label.trim() || Number(l.price));
  if (!d.lines.length && !(d.type === "devis" && d.status === "brouillon")) { toast("Ajoutez au moins une ligne."); d.lines = [{ label: "", qty: 1, unit: "U", price: 0 }]; renderSheet(); return; }
  d.concerne = (d.concerne || "").trim();
  if (d.concerne) {
    let site = siteByName(d.clientId, d.concerne);
    if (!site) {
      const sid = "site-" + uid(), body = { clientId: d.clientId, name: d.concerne.toUpperCase(), city: "", travelFee: 0 };
      if (await save("sites/" + sid, body)) site = { id: sid, ...body };
    }
    d.siteId = site ? site.id : "";
  }
  if (!d.number.trim()) { toast("Indiquez un numéro."); return; }
  const dup = S.docs.find((x) => x.number === d.number.trim() && x.id !== d.id);
  if (dup) { toast("Ce numéro existe déjà : " + dup.number); return; }
  const c = S.clients.find((x) => x.id === d.clientId);
  const { id, isNew, ...body } = d;
  body.number = body.number.trim();
  body.lines = body.lines.map((l) => ({ label: l.label.split("\n").map((x) => x.trim()).filter(Boolean).join("\n"), qty: Number(l.qty) || 0, unit: l.unit || "", price: round(l.price) }));
  body.discount = Number(body.discount) || 0;
  body.vatRate = Number(body.vatRate) || 0;
  body.clientSnap = c ? { name: c.name, contact: c.contact || "", address: c.address || "", city: c.city || "", phone: c.phone || "", email: c.email || "", nif: c.nif || "", stat: c.stat || "" } : body.clientSnap || {};
  body.updatedAt = Date.now();
  if (await save("docs/" + id, body)) { toast(isNew ? "Document créé" : "Modifications enregistrées"); S.editing = null; S.viewing = id; render(); }
}

async function toInvoice(dv) {
  const f = newDoc("facture");
  Object.assign(f, { clientId: dv.clientId, clientSnap: dv.clientSnap, subject: dv.subject, lines: dv.lines, discount: dv.discount, vat: dv.vat, vatRate: dv.vatRate, notes: dv.notes, reference: dv.reference || "", concerne: dv.concerne || "", siteId: dv.siteId || "", bc: dv.bc || null, sourceId: dv.id });
  const { id, isNew, ...body } = f;
  if (!(await save("docs/" + id, body))) return;
  const { id: did, ...dvBody } = dv;
  await save("docs/" + did, { ...dvBody, status: dvBody.status === "archive" ? "archive" : "accepte", factureId: id });
  toast("Facture " + f.number + " créée");
  S.viewing = id; render();
}

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "close-dialog-bg") { if (e.target === el) closeDialog(); return; }
  const cur = S.viewing && S.docs.find((x) => x.id === S.viewing);
  switch (a) {
    case "new-devis": openEditor(newDoc("devis")); break;
    case "new-demande": demandeDialog(); break;
    case "goto-dossiers": S.filter.dossiers = el.dataset.val; location.hash = "dossiers"; break;
    case "bc": if (cur) bcDialog(cur); break;
    case "intervention": if (cur) interventionDialog(cur); break;
    case "edit-site": siteDialog(S.sites.find((x) => x.id === el.dataset.id)); break;
    case "delete-site": {
      const s = S.sites.find((x) => x.id === el.dataset.id);
      if (s && S.docs.some((d) => norm(d.concerne) === norm(s.name))) { toast("Cette agence a des devis : elle ne peut pas être supprimée."); break; }
      if (await remove("sites/" + el.dataset.id)) { toast("Agence supprimée"); closeDialog(); }
      break;
    }
    case "pick-svc": {
      const line = el.closest(".line[data-i]"), l = S.editing.lines[+line.dataset.i];
      const svc = S.services.find((x) => x.id === el.dataset.id); if (!svc) break;
      const p = priceFor(svc.label, S.editing.concerne) || svc;
      Object.assign(l, { label: svc.label, unit: p.unit || svc.unit, price: p.price });
      renderSheet(); refreshTotals();
      if (p.from) toast("Prix repris du " + p.from + " (même agence)");
      break;
    }
    case "new-facture": openEditor(newDoc("facture")); break;
    case "open-doc": e.preventDefault(); S.editing = null; S.viewing = el.dataset.id; renderSheet(); break;
    case "close-sheet": closeSheet(); break;
    case "close-dialog": closeDialog(); break;
    case "filter": S.filter[el.dataset.key] = el.dataset.val; render(); break;
    case "add-line": S.editing.lines.push({ label: "", qty: 1, unit: "U", price: 0 }); renderSheet(); { const ins = document.querySelectorAll('#lines [data-f="label"]'); ins[ins.length - 1].focus(); } break;
    case "del-line": { const i = +el.closest(".line").dataset.i; S.editing.lines.splice(i, 1); if (!S.editing.lines.length) S.editing.lines.push({ label: "", qty: 1, unit: "U", price: 0 }); renderSheet(); break; }
    case "save-doc": saveEditor(); break;
    case "edit-doc": if (cur) openEditor(cur); break;
    case "pdf": if (cur) downloadPdf(cur); break;
    case "pay": if (cur) payDialog(cur); break;
    case "del-pay": if (cur) confirmDialog("Retirer ce paiement ?", "Le montant sera de nouveau compté comme restant à payer.", "Retirer", async () => {
      const { id, ...body } = cur; const payments = [...cur.payments]; payments.splice(+el.dataset.i, 1);
      return save("docs/" + id, { ...body, payments });
    }); break;
    case "set-status": if (cur) { const { id, ...body } = cur; if (await save("docs/" + id, { ...body, status: el.dataset.val })) toast("Statut mis à jour"); } break;
    case "to-invoice": if (cur) toInvoice(cur); break;
    case "duplicate": if (cur) { const n = newDoc(cur.type); Object.assign(n, { clientId: cur.clientId, clientSnap: cur.clientSnap, subject: cur.subject, lines: cur.lines, discount: cur.discount, vat: cur.vat, vatRate: cur.vatRate, notes: cur.notes, reference: "", concerne: cur.concerne || "", startDelay: cur.startDelay || "", execDelay: cur.execDelay || "", garantie: cur.garantie || "", marque: cur.marque || "", delaiLivraison: cur.delaiLivraison || "", debutLivraison: cur.debutLivraison || "" }); openEditor(n); } break;
    case "delete-doc": if (cur) confirmDialog("Supprimer " + cur.number + " ?", "Le document sera définitivement effacé. Cette action est irréversible.", "Supprimer", async () => {
      const ok = await remove("docs/" + cur.id); if (ok) { toast("Document supprimé"); S.viewing = null; render(); } return ok;
    }); break;
    case "edit-client": clientDialog(S.clients.find((c) => c.id === el.dataset.id)); break;
    case "delete-client": {
      const id = el.dataset.id;
      if (S.docs.some((d) => d.clientId === id)) { toast("Ce client a des documents : il ne peut pas être supprimé."); break; }
      if (await remove("clients/" + id)) { toast("Client supprimé"); closeDialog(); }
      break;
    }
    case "del-logo": { const { logo, ...rest } = S.company; if (await save("settings/company", rest)) toast("Logo retiré"); break; }
    case "edit-service": serviceDialog(S.services.find((s) => s.id === el.dataset.id)); break;
    case "delete-service": if (await remove("services/" + el.dataset.id)) { toast("Prestation supprimée"); closeDialog(); } break;
  }
});

/* Saisie dans l'éditeur : mise à jour sans tout redessiner */
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "q") { S.filter.q = t.value; const pos = t.selectionStart; render(); const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } return; }
  const d = S.editing; if (!d) return;
  const line = t.closest(".line[data-i]");
  if (line && t.dataset.f) {
    const l = d.lines[+line.dataset.i];
    l[t.dataset.f] = t.value;
    if (t.dataset.f === "label") {
      t.rows = Math.max(1, t.value.split("\n").length);
      const box = line.querySelector(".sugg"), k = norm(t.value);
      const hits = k.length < 2 ? [] : S.services.filter((x) => norm(x.label).includes(k)).slice(0, 6);
      box.innerHTML = hits.map((x) => `<button type="button" data-action="pick-svc" data-id="${esc(x.id)}"><span>${esc(x.label.split("\n")[0])}</span><span class="num">${ar((priceFor(x.label, d.concerne) || x).price)}</span></button>`).join("");
      box.hidden = !hits.length;
    }
    line.querySelector("[data-tot]").textContent = ar((Number(l.qty) || 0) * (Number(l.price) || 0));
    refreshTotals(); return;
  }
  const map = { e_number: "number", e_date: "date", e_dueDate: "dueDate", e_validUntil: "validUntil", e_subject: "subject", e_reference: "reference", e_concerne: "concerne", e_startDelay: "startDelay", e_execDelay: "execDelay", e_garantie: "garantie", e_marque: "marque", e_delaiLivraison: "delaiLivraison", e_debutLivraison: "debutLivraison", e_discount: "discount", e_vatRate: "vatRate", e_notes: "notes" };
  if (map[t.id]) { d[map[t.id]] = t.value; if (t.id === "e_discount" || t.id === "e_vatRate") refreshTotals(); }
  if (t.id === "e_bcNumber" || t.id === "e_bcDate") d.bc = { ...(d.bc || {}), [t.id === "e_bcNumber" ? "number" : "date"]: t.value };
});
/* Logo : réduit à 900 px de large pour rester léger, enregistré dans la fiche entreprise */
async function uploadLogo(file) {
  if (!file || !file.type.startsWith("image/")) { toast("Choisissez une image (JPG ou PNG)."); return; }
  const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const scale = Math.min(1, 900 / img.width);
  const cv = document.createElement("canvas");
  cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
  const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
  const logo = cv.toDataURL("image/jpeg", 0.88);
  if (logo.length > 200000) { toast("Image trop lourde. Essayez une image plus petite."); return; }
  if (await save("settings/company", { ...S.company, logo })) toast("Logo enregistré");
}

document.addEventListener("change", (e) => {
  const t = e.target, d = S.editing;
  if (t.id === "co_logo") { uploadLogo(t.files[0]); return; }
  if (d && t.id === "e_vat") { d.vat = t.checked; refreshTotals(); }
  if (d && t.id === "e_status") d.status = t.value;
  if (d && t.id === "e_date" && d.isNew) {
    const c = S.company;
    if (d.type === "devis") { d.validUntil = addDays(t.value, c.validity ?? 30); $("#e_validUntil").value = d.validUntil; }
    else { d.dueDate = addDays(t.value, c.terms ?? 30); $("#e_dueDate").value = d.dueDate; }
  }
  if (d && t.id === "e_clientId") {
    if (t.value === "__new") {
      t.value = d.clientId || "";
      clientDialog(null, (id, data) => { d.clientId = id; S.clients = [...S.clients, { id, ...data }]; renderSheet(); });
    } else d.clientId = t.value;
  }
});
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "coForm") return;
  e.preventDefault();
  const g = (k) => $("#co_" + k).value.trim();
  const data = { ...S.company };
  ["name", "activity", "address", "city", "phone", "email", "nif", "stat", "rcs", "bank", "mobile", "footer", "prefix", "startDelay", "execDelay", "signTitle", "signName"].forEach((k) => (data[k] = g(k)));
  data.vat = $("#co_vat").checked;
  data.vatRate = Number(g("vatRate")) || 0;
  data.validity = Number(g("validity")) || 30;
  data.terms = Number(g("terms")) || 30;
  data.nextDevis = Number(g("nextDevis")) || 0;
  data.nextFacture = Number(g("nextFacture")) || 0;
  if (await save("settings/company", data)) toast("Informations de l'entreprise enregistrées");
});
document.addEventListener("focusout", (e) => {
  if (e.target.matches && e.target.matches("textarea.desc")) {
    const box = e.target.parentElement.querySelector(".sugg");
    setTimeout(() => { if (box && !box.contains(document.activeElement)) box.hidden = true; }, 200);
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("#dialog").innerHTML) closeDialog();
  else if (S.viewing && !S.editing) closeSheet();
});

boot();
</script>
